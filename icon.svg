<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B863"/>
      <stop offset="100%" stop-color="#008C4A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Shopping bag body -->
  <path d="M 140 200 L 372 200 L 372 410 Q 372 442 340 442 L 172 442 Q 140 442 140 410 Z"
        fill="#ffffff" filter="url(#shadow)"/>

  <!-- Bag top edge -->
  <rect x="128" y="180" width="256" height="40" rx="16" fill="#ffffff" opacity="0.85"/>

  <!-- Bag handle -->
  <path d="M 200 200 Q 200 110 256 110 Q 312 110 312 200"
        fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>

  <!-- Checkmark -->
  <path d="M 195 320 L 240 365 L 325 275"
        fill="none" stroke="#00AA5B" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
